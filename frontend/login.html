<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Lokaya</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#241A12">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>

<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:36px;width:100%;max-width:420px">
    <h1 style="font-size:24px">Content de vous revoir</h1>
    <p style="color:var(--muted-text);margin-top:6px;margin-bottom:24px">Connectez-vous pour réserver et gérer vos séjours.</p>
    <form id="login-form">
      <div class="field">
        <label>Adresse e-mail</label>
        <input type="email" id="email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <div id="login-error" style="color:var(--clay);font-size:13px;margin-bottom:12px;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Se connecter</button>
    </form>
    <p style="text-align:center;margin-top:14px;font-size:13px"><a href="#" id="forgot-password-link" style="color:var(--muted-text)">Mot de passe oublié ?</a></p>
    <p style="text-align:center;margin-top:10px;font-size:14px;color:var(--muted-text)">Pas encore de compte ? <a href="/signup.html" style="color:var(--ink);font-weight:600">Créer un compte</a></p>
  </div>
</div>

<div class="overlay hidden" id="forgot-modal-overlay">
  <div class="modal" style="max-width:400px">
    <button class="modal-close" id="forgot-modal-close">✕</button>
    <h2>Mot de passe oublié</h2>
    <p class="modal-sub">Indique ton email : l'administrateur sera prévenu et te contactera avec un nouveau mot de passe.</p>
    <form id="forgot-form">
      <div class="field"><label>Adresse e-mail</label><input type="email" id="forgot-email" required></div>
      <div id="forgot-result" style="font-size:14px;margin-bottom:12px;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="forgot-submit">Envoyer la demande</button>
    </form>
  </div>
</div>

<div id="app-footer"></div>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/calculators.js"></script>
<script src="/assets/js/cookies.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
mountLayout('');
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-submit');
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Connexion…';
  try {
    const { token, user } = await api('/auth/login', {
      method: 'POST', auth: false,
      body: { email: document.getElementById('email').value, password: document.getElementById('password').value },
    });
    Auth.setToken(token); Auth.setUser(user);
    const next = new URLSearchParams(window.location.search).get('next');
    window.location.href = user.role === 'admin' ? '/admin/admin-dashboard.html' : (next || '/dashboard.html');
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});

document.getElementById('forgot-password-link').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('forgot-modal-overlay').classList.remove('hidden');
});
document.getElementById('forgot-modal-close').addEventListener('click', () => {
  document.getElementById('forgot-modal-overlay').classList.add('hidden');
});
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('forgot-submit');
  const resultEl = document.getElementById('forgot-result');
  btn.disabled = true; btn.textContent = 'Envoi…';
  try {
    const { message } = await api('/auth/forgot-password', { method: 'POST', auth: false, body: { email: document.getElementById('forgot-email').value } });
    resultEl.textContent = message; resultEl.style.color = 'var(--forest)'; resultEl.style.display = 'block';
    document.getElementById('forgot-email').disabled = true;
    btn.style.display = 'none';
  } catch (err) {
    resultEl.textContent = err.message; resultEl.style.color = 'var(--clay)'; resultEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Envoyer la demande';
  }
});
</script>
</body>
</html>
