<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer un compte — Rentify</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#241A12">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>

<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:36px;width:100%;max-width:440px">
    <h1 style="font-size:24px">Créer votre compte Rentify</h1>
    <p style="color:var(--muted-text);margin-top:6px;margin-bottom:24px">Rejoignez Rentify et commencez à réserver.</p>
    <form id="signup-form">
      <div class="field">
        <label>Nom complet</label>
        <input type="text" id="name" placeholder="Votre nom" required>
      </div>
      <div class="field">
        <label>Adresse e-mail</label>
        <input type="email" id="email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label>Téléphone (optionnel)</label>
        <input type="tel" id="phone" placeholder="6XX XXX XXX">
      </div>
      <div class="field">
        <label>Pays</label>
        <select id="country"></select>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="6 caractères minimum" required minlength="6">
      </div>
      <div class="field" style="margin-top:2px">
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer">
          <input type="checkbox" id="want-seller" style="width:auto">
          Je souhaite aussi proposer mes logements en tant que vendeur
        </label>
      </div>
      <div id="signup-error" style="color:var(--clay);font-size:13px;margin-bottom:12px;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="signup-submit">Créer mon compte</button>
    </form>
    <p style="text-align:center;margin-top:20px;font-size:14px;color:var(--muted-text)">Déjà inscrit ? <a href="/login.html" style="color:var(--ink);font-weight:600">Se connecter</a></p>
  </div>
</div>

<div id="app-footer"></div>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/countries.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/calculators.js"></script>
<script src="/assets/js/cookies.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
mountLayout('');
populateCountrySelect(document.getElementById('country'));
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signup-submit');
  const errEl = document.getElementById('signup-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Création…';
  try {
    const { token, user } = await api('/auth/register', {
      method: 'POST', auth: false,
      body: {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        country: document.getElementById('country').value,
        password: document.getElementById('password').value,
        want_seller: document.getElementById('want-seller').checked,
      },
    });
    Auth.setToken(token); Auth.setUser(user);
    window.location.href = user.role === 'vendeur' ? '/vendeur.html' : '/dashboard.html';
  } catch (err) {
    errEl.textContent = err.message; errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Créer mon compte';
  }
});
</script>
</body>
</html>
