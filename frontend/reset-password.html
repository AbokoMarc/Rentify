<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Lokaya</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:40px 20px">
  <div style="background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:36px;width:100%;max-width:420px">
    <h1 style="font-size:24px">Nouveau mot de passe</h1>
    <p style="color:var(--muted-text);margin-top:6px;margin-bottom:24px">Choisis un mot de passe d'au moins 8 caractères.</p>
    <form id="reset-form">
      <div class="field"><label>Nouveau mot de passe</label><input type="password" id="pw1" required minlength="8" autocomplete="new-password"></div>
      <div class="field"><label>Confirmer</label><input type="password" id="pw2" required minlength="8" autocomplete="new-password"></div>
      <div id="reset-msg" style="font-size:13px;margin-bottom:12px;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Valider</button>
    </form>
  </div>
</div>
<div id="app-footer"></div>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/calculators.js"></script>
<script src="/assets/js/cookies.js"></script>
<script src="/assets/js/layout.js"></script>
<script>
mountLayout('');
const token = new URLSearchParams(location.search).get('token') || '';
history.replaceState(null, '', location.pathname); // retire le jeton de la barre d'adresse
const msg = document.getElementById('reset-msg');
document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.style.display = 'none';
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  const show = (t, c) => { msg.textContent = t; msg.style.color = c; msg.style.display = 'block'; };
  if (a !== b) return show('Les deux mots de passe ne correspondent pas.', 'var(--clay)');
  const btn = document.getElementById('reset-submit'); btn.disabled = true;
  try {
    await api('/auth/reset-password', { method: 'POST', auth: false, body: { token, new_password: a } });
    show('Mot de passe modifié ✅ Redirection vers la connexion…', 'var(--forest)');
    setTimeout(() => location.href = '/login.html', 1800);
  } catch (err) { show(err.message, 'var(--clay)'); btn.disabled = false; }
});
</script>
</body>
</html>
