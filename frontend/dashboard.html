<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon espace — Lokaya</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F26A1B">
<link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div id="app-header"></div>

<div class="container" style="padding:32px 24px 60px">
  <div class="dash-hello">
    <h1 id="dash-hello-title">Bonjour</h1>
    <p>Votre activité aujourd'hui</p>
    <span class="kyc-badge off" id="dash-badge">✉️ Email à confirmer</span>
  </div>
  <div class="dash-tiles">
    <div class="dash-tile t1"><div class="num" id="tile-bookings">–</div><div class="lbl">réservations</div></div>
    <div class="dash-tile t2"><div class="num" id="tile-points">–</div><div class="lbl">points fidélité</div></div>
    <div class="dash-tile t3"><div class="num" id="tile-favs">–</div><div class="lbl">favoris</div></div>
  </div>
  <div id="verify-banner" class="hidden" style="background:#FBEBD9;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
    <span style="font-size:13px;color:var(--gold-deep);font-weight:600">📧 Ton adresse email n'est pas encore confirmée.</span>
    <button class="btn btn-ghost btn-sm" id="resend-verify-btn">Renvoyer l'email de confirmation</button>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="bookings" data-i18n="nav_bookings">Mes réservations</button>
    <button class="tab-btn" data-tab="demandes">Mes demandes immo</button>
    <button class="tab-btn" data-tab="favoris" id="favoris-tab-btn" data-i18n="nav_favorites">Favoris</button>
    <button class="tab-btn" data-tab="profil" data-i18n="my_profile">Profil</button>
  </div>

  <div id="tab-bookings">
    <div class="grid" id="bookings-list" style="grid-template-columns:1fr;gap:16px">
      <div class="skeleton" style="height:100px"></div>
    </div>
  </div>

  <div id="tab-demandes" class="hidden">
    <div class="grid" id="demandes-list" style="grid-template-columns:1fr;gap:16px">
      <div class="skeleton" style="height:100px"></div>
    </div>
  </div>

  <div id="tab-favoris" class="hidden">
    <div class="grid grid-3" id="favoris-grid">
      <div class="skeleton" style="height:280px"></div>
    </div>
  </div>

  <div id="tab-profil" class="hidden" style="max-width:480px">
    <div style="background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:24px;margin-bottom:20px">
      <h3 style="margin-bottom:16px" data-i18n="personal_info_title">Informations personnelles</h3>
      <div class="field"><label data-i18n="full_name_label">Nom complet</label><input type="text" id="p-name"></div>
      <div class="field"><label data-i18n="phone_label">Téléphone</label><input type="text" id="p-phone"></div>
      <button class="btn btn-dark" id="p-save">Enregistrer</button>
    </div>
    <div style="background:white;border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:24px">
      <h3 style="margin-bottom:16px" data-i18n="change_password_title">Changer mon mot de passe</h3>
      <div class="field"><label data-i18n="current_password_label">Mot de passe actuel</label><input type="password" id="p-current"></div>
      <div class="field"><label data-i18n="new_password_label">Nouveau mot de passe</label><input type="password" id="p-new"></div>
      <div id="p-pass-error" style="color:var(--clay);font-size:13px;margin-bottom:10px;display:none"></div>
      <button class="btn btn-outline-ink" id="p-change-pass">Mettre à jour le mot de passe</button>
    </div>
  </div>
</div>

<div id="app-footer"></div>
<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/calculators.js"></script>
<script src="/assets/js/cookies.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/notifications.js"></script>
<script src="/assets/js/dashboard.js"></script>
</body>
</html>
