<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logements — Admin Lokaya</title>
<link rel="icon" href="/assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#241A12">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  table { width: 100%; border-collapse: collapse; background: white; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-card); }
  th, td { text-align: left; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--line); }
  th { background: var(--sand-deep); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-text); }
  tr:last-child td { border-bottom: none; }
  .thumb { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; }
  .row-actions { display: flex; gap: 8px; }
  .status-toggle { font-size: 12px; padding: 4px 10px; border-radius: 999px; font-weight: 700; border: none; cursor: pointer; }
</style>
</head>
<body>
<div id="app-header"></div>
<div class="container" style="padding:32px 24px 60px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">
    <div><h1 style="font-size:26px">Logements</h1><p style="color:var(--muted-text);margin-top:4px">Ajoute, modifie ou retire des logements du catalogue.</p></div>
    <button class="btn btn-primary" id="new-room-btn">+ Ajouter un logement</button>
  </div>

  <div style="overflow-x:auto">
    <table class="responsive-table">
      <thead><tr><th></th><th>Titre</th><th>Ville / Pays</th><th>Type</th><th>Prix</th><th>Validation</th><th>Statut</th><th>Actions</th></tr></thead>
      <tbody id="rooms-tbody"><tr><td colspan="8" style="padding:30px;text-align:center;color:var(--muted-text)">Chargement…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="overlay hidden" id="room-modal-overlay">
  <div class="modal modal-lg">
    <button class="modal-close" id="room-modal-close">✕</button>
    <h2 id="room-modal-title">Ajouter un logement</h2>
    <p class="modal-sub">Renseigne les informations du logement. Il sera visible immédiatement si le statut est "disponible".</p>
    <form id="room-form">
      <input type="hidden" id="rm-id">
      <div class="field"><label>Titre</label><input type="text" id="rm-title" required></div>
      <div class="field-row">
        <div class="field"><label>Type</label>
          <select id="rm-type"><option value="chambre">Chambre</option><option value="appartement">Appartement</option><option value="maison">Maison</option></select>
        </div>
        <div class="field"><label>Statut</label>
          <select id="rm-status"><option value="disponible">Disponible</option><option value="indisponible">Indisponible</option></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Ville</label><input type="text" id="rm-city" list="cm-cities" required>
          <datalist id="cm-cities"><option value="Yaoundé"><option value="Douala"><option value="Kribi"><option value="Buea"><option value="Limbe"><option value="Bafoussam"><option value="Bamenda"><option value="Garoua"><option value="Maroua"><option value="Ngaoundéré"></datalist>
        </div>
        <div class="field"><label>Pays</label><input type="text" id="rm-country" value="Cameroun" required></div>
      </div>
      <div class="field"><label>Adresse</label><input type="text" id="rm-address"></div>
      <div class="field-row">
        <div class="field"><label>Latitude (pour calcul de distance)</label><input type="number" step="any" id="rm-lat" placeholder="Ex : 48.8566"></div>
        <div class="field"><label>Longitude</label><input type="number" step="any" id="rm-lng" placeholder="Ex : 2.3522"></div>
      </div>
      <div class="field"><label>Description</label><textarea id="rm-desc" rows="3"></textarea></div>
      <div class="field-row">
        <div class="field"><label>Prix</label><input type="number" id="rm-price" required></div>
        <div class="field"><label>Période</label>
          <select id="rm-pricing-period"><option value="nuit">Par nuit</option><option value="mois">Par mois</option></select>
        </div>
        <div class="field"><label>Meublé ?</label>
          <select id="rm-furnished"><option value="">Non précisé</option><option value="1">Meublé</option><option value="0">Non meublé</option></select>
        </div>
        <div class="field"><label>Adultes max</label><input type="number" id="rm-adults" value="2"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Enfants max</label><input type="number" id="rm-children" value="0"></div>
        <div class="field"><label>Chambres</label><input type="number" id="rm-bedrooms" value="1"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Lits</label><input type="number" id="rm-beds" value="1"></div>
        <div class="field"><label>Salles de bain</label><input type="number" id="rm-bathrooms" value="1"></div>
      </div>
      <div class="field"><label>Équipements (séparés par des virgules)</label><input type="text" id="rm-amenities" placeholder="Wifi, Climatisation, Parking"></div>
      <div class="field"><label>Conditions particulières (optionnel)</label><textarea id="rm-terms" rows="3" placeholder="Ex : Caution d'un mois exigée..."></textarea></div>
      <div class="field"><label>Photos</label><div id="rm-image-uploader"></div></div>
      <div class="field"><label><input type="checkbox" id="rm-featured" style="width:auto;margin-right:8px">Mettre en avant sur la page d'accueil</label></div>
      <div id="room-form-error" style="color:var(--clay);font-size:13px;margin-bottom:10px;display:none"></div>
      <button type="submit" class="btn btn-primary btn-block" id="room-form-submit">Enregistrer</button>
    </form>
  </div>
</div>

<script src="/assets/js/icons.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/theme.js"></script>
<script src="/assets/js/payment-icons.js"></script>
<script src="/assets/js/layout.js"></script>
<script src="/assets/js/notifications.js"></script>
<script src="/assets/js/imageuploader.js"></script>
<script src="/assets/js/admin-rooms.js"></script>
</body>
</html>
